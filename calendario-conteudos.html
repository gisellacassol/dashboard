<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Calendário editorial · Grupo Cassol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--bg:#f6f2ed;--surface:#fffdfb;--text:#251a15;--soft:#806f66;--line:#e8ded7;--editora:#a92a25;--leia:#66306f;--gc:#373737}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif}button{font:inherit}
    main{width:min(1280px,calc(100% - 32px));margin:0 auto;padding:34px 0 60px}.brand{color:var(--soft);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:18px 0 22px}h1{font-family:'Playfair Display',serif;font-size:clamp(30px,5vw,48px);margin:0}.readonly{color:var(--soft);font-size:12px}
    .calendar{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 55px rgba(62,39,28,.07)}.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.week div{padding:8px;color:var(--soft);font-size:11px;font-weight:700;text-align:center;text-transform:uppercase}.day{min-height:132px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:8px;min-width:0}.day:nth-child(7n+1){border-left:0}.empty{background:#faf7f4}.num{font-size:12px;font-weight:700;margin-bottom:7px}.item{width:100%;border:0;border-left:3px solid;border-radius:6px;padding:6px 7px;margin-bottom:5px;text-align:left;font-size:11px;line-height:1.25;cursor:pointer;overflow-wrap:anywhere}.item:hover{filter:brightness(.96)}.item.editora{color:#7b1414;background:#f5e4e2;border-color:var(--editora)}.item.leia{color:#4e1d58;background:#eee4f0;border-color:var(--leia)}.item.gisella{color:#222;background:#e9e7e5;border-color:var(--gc)}
    .message{text-align:center;color:var(--soft);padding:70px 20px}.overlay{position:fixed;inset:0;background:rgba(35,25,20,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.overlay.open{display:flex}.modal{width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px;padding:26px;box-shadow:0 25px 80px rgba(0,0,0,.2);position:relative}.close{position:absolute;right:15px;top:12px;background:none;border:0;font-size:26px;color:var(--soft);cursor:pointer}.modal h2{font-family:'Playfair Display',serif;font-size:28px;margin:0 35px 5px 0}.subtitle{color:var(--soft);font-size:12px;margin-bottom:22px}.details{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{border-top:1px solid var(--line);padding-top:10px;min-width:0}.field.wide{grid-column:1/-1}.label{color:var(--soft);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}.value{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.value a{color:#7b1414}.footer{text-align:center;color:var(--soft);font-size:11px;margin-top:18px}
    @media(max-width:760px){main{width:min(100% - 16px,1280px);padding-top:20px}.top{align-items:start;flex-direction:column}.calendar{padding:8px;overflow-x:auto}.week,.grid{min-width:760px}.day{min-height:112px}.details{grid-template-columns:1fr}.field.wide{grid-column:auto}.modal{padding:22px}}
  </style>
</head>
<body>
  <main>
    <div class="brand">Grupo Cassol · calendário editorial</div>
    <div class="top"><h1 id="month-title">Calendário editorial</h1><div class="readonly">Página somente para visualização</div></div>
    <section class="calendar" id="calendar"><div class="message">Carregando o calendário…</div></section>
    <div class="footer">Os dados são atualizados automaticamente pelo Dashboard.</div>
  </main>
  <div class="overlay" id="detail-overlay" role="dialog" aria-modal="true" aria-labelledby="detail-title">
    <div class="modal"><button class="close" id="detail-close" aria-label="Fechar">×</button><h2 id="detail-title"></h2><div class="subtitle" id="detail-subtitle"></div><div class="details" id="detail-fields"></div></div>
  </div>
  <script src="calendario-conteudos.js?v=1.0.2"></script>
</body>
</html>
